name: Check

# The same check a contributor runs locally (node scripts/check.mjs): every SKILL.md against the
# Agent Skills specification, the relative links, the plugin versions in plugin.json and
# marketplace.json, and the README catalog against the skills' frontmatter.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check skills
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Check
        run: node scripts/check.mjs
